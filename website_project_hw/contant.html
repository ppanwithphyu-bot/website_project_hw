<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">VORTEX</a>

            <ul class="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contant.html" class="active">Contact</a></li>
               <li><a href="profile.html"><i class="fa-solid fa-user"></i></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contact_section">
            <div class="contact_container">
                <div class="left">
                    <h1>Contact Us</h1>
                    <p><p>Get in touch with us via the form below for inquiries about buying, selling, or automotive details.</p></p>

                    <div class="info_item">
                        <i class="fa-solid fa-envelope"></i>
                        <div class="info_text">
                            <h4>Email</h4>
                            <p>support@vortex.com</p>
                        </div>
                    </div>

                    <div class="info_item">
                        <i class="fa-solid fa-phone"></i>
                        <div class="info_text">
                            <h4>Phone</h4>
                            <p>09-790123456</p>
                        </div>
                    </div>

                    <div class="info_item">
                        <i class="fa-solid fa-location-dot"></i>
                        <div class="info_text">
                            <h4>Address</h4>
                            <p>Yankin Township, Yangon</p>
                        </div>
                    </div>
                </div>

                <div class="right">
                    <form>
                        <div class="first">
                            <div class="form_group">
                                <label>Username</label>
                                <input type="text" placeholder="Enter your name" required>
                            </div>

                            <div class="form_group">
                                <label>Email</label>
                                <input type="email" placeholder="example@gmail.com" required>
                            </div>
                        </div>

                        <div class="form_group">
                            <label>Category</label>
                            <select>
                                <option>Kia Inquiry</option>
                                <option>IM Inquiry</option>
                                <option>EV Inquiry</option>
                                <option>Sell My Car</option>
                            </select>
                        </div>

                        <div class="form_group">
                            <label>Message</label>
                            <textarea rows="4" placeholder="Type your message..." required></textarea>
                        </div>

                        <button type="submit">Submit</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 VORTEX Automotive. All right reserve.</p>
    </footer>
</body>
</html>
