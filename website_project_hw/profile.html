<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - VORTEX</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">VORTEX</a>

            <ul class="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contant.html">Contact</a></li>
                <li><a href="profile.html" class="profile-icon active"><i class="fa-solid fa-user"></i></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contact_section">
            <div class="contact_container profile-page-container">
                <div class="right">
                    
                    <!-- Profile Header -->
                    <div class="profile-header-box">
                        <div class="profile-avatar-icon">
                            <i class="fa-solid fa-user-circle"></i>
                        </div>
                        <h1>User Profile</h1>
                        <p>Sign in to manage your account and car listings</p>
                    </div>

                    <!-- Login Form -->
                    <form>
                        <div class="form_group">
                            <label>Email Address</label>
                            <input type="email" placeholder="example@gmail.com" required>
                        </div>

                        <div class="form_group">
                            <label>Password</label>
                            <input type="password" placeholder="••••••••" required>
                        </div>

                        <button type="submit">Log In / Sign In</button>
                    </form>

                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 VORTEX Automotive. All rights reserved.</p>
    </footer>
</body>
</html>
